name: Build Windows Offline App

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/offline-windows-app-ecf8
      - main
    paths:
      - "desktop/**"
      - "app/**"
      - "templates/**"
      - "static/**"
      - "schema_sqlite.sql"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build exe with PyInstaller
        run: python -m PyInstaller desktop/euroglass.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuroglassHardware-windows
          path: dist/EuroglassHardware.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/offline-windows-app-ecf8'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-offline-${{ github.run_number }}
          name: Euroglass Hardware Windows Offline (build ${{ github.run_number }})
          body: |
            Offline Windows app build.

            Download **EuroglassHardware.exe**, then double-click to open.

            First run creates a local database under `%LOCALAPPDATA%\EuroglassHardware\`.
          files: dist/EuroglassHardware.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
